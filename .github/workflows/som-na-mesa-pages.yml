name: Publicar SOM NA MESA no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: som-na-mesa-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar somente os arquivos publicos do jogo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /index.html
            /style.css
            /ui-dialogs.css
            /ui-dialogs.js
            /media-config.js
            /musicas.js
            /categorias.js
            /karaoke.js
            /script.js
            /karaoke-core.js
            /karaoke-mode.js
            /img/
          sparse-checkout-cone-mode: false

      - name: Validar arquivos necessarios
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html style.css ui-dialogs.css ui-dialogs.js media-config.js musicas.js categorias.js karaoke.js script.js karaoke-core.js karaoke-mode.js; do
            test -f "$file" || { echo "Arquivo publico ausente: $file"; exit 1; }
          done
          test -d img || { echo "Pasta img ausente."; exit 1; }
          grep -q 'media-config.js' index.html
          grep -q 'somNaMesaMediaUrl' script.js
          grep -q 'somNaMesaMediaUrl' karaoke-mode.js

      - name: Montar site publico por lista permitida
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp index.html style.css ui-dialogs.css ui-dialogs.js media-config.js musicas.js categorias.js karaoke.js script.js karaoke-core.js karaoke-mode.js site/
          cp -R img site/img
          touch site/.nojekyll

          if find site -type f \( -iname 'admin.html' -o -iname 'admin.js' -o -iname 'admin.css' -o -iname 'admin-karaoke.js' \) | grep -q .; then
            echo "ERRO: arquivo administrativo entrou no pacote publico."
            exit 1
          fi
          if [ -d site/audio ] || [ -d site/karaoke ] || [ -d site/supabase ]; then
            echo "ERRO: pasta de midia ou backend entrou no pacote publico."
            exit 1
          fi

          size_bytes=$(du -sb site | cut -f1)
          echo "Tamanho do site publico: $size_bytes bytes"
          if [ "$size_bytes" -gt 1000000000 ]; then
            echo "ERRO: o artefato excede 1 GB."
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
